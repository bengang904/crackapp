<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>破解版软件下载</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;width:100%;min-width:0}
body{background:#f5f6f8;color:#202124;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",Arial,sans-serif;overflow-x:hidden}
header{background:#fff;border-bottom:1px solid #e5e7eb;position:sticky;top:0;z-index:10;width:100%}
.header-inner{width:100%;max-width:1200px;margin:auto;padding:12px 20px}
.search{width:100%}
.search input{display:block;width:100%;min-width:0;height:40px;padding:8px 13px;border:1px solid #d9dce1;border-radius:8px;font-size:14px;outline:none;background:#fff;color:#202124}
.search input:focus{border-color:#888}
main{width:100%;max-width:1200px;margin:auto;padding:24px 20px}
.apps{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(300px,100%),1fr));gap:14px;align-items:start}
.app{width:100%;min-width:0;background:#fff;border:1px solid #e5e7eb;border-radius:10px;padding:16px;transition:.15s;overflow:hidden;align-self:start}
.app:hover{transform:translateY(-2px);box-shadow:0 5px 20px rgba(0,0,0,.07)}
.app-top{display:flex;gap:12px;min-width:0}
.icon{width:52px;height:52px;min-width:52px;border-radius:9px;object-fit:contain;background:#f1f3f4}
.app-top>div{min-width:0;flex:1}
.app-name{font-size:16px;font-weight:650;margin-bottom:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.description{color:#6b7280;font-size:13px;line-height:1.5;word-break:break-word}
.description-text{height:58.5px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical}
.description.expanded .description-text{height:auto;display:block}
.description-toggle{display:none;margin-top:4px;color:#555;font-size:12px;cursor:pointer;user-select:none}
.description-toggle:hover{text-decoration:underline}
.description.has-overflow .description-toggle{display:inline-block}
.meta{display:flex;justify-content:center;align-items:center;flex-wrap:wrap;gap:6px;margin-top:13px;font-size:12px;color:#6b7280}
.tag{background:#f1f3f5;padding:4px 7px;border-radius:5px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.download{display:block;width:100%;margin-top:13px;background:#202124;color:#fff;text-decoration:none;text-align:center;padding:9px 8px;border-radius:7px;font-size:14px;line-height:20px}
.download:hover{background:#000}
.empty{text-align:center;padding:60px 15px;color:#777;display:none}
@media(max-width:600px){
.header-inner{padding:10px 12px}
main{padding:16px 12px}
.apps{grid-template-columns:1fr;gap:10px}
.app{padding:13px}
}
@media(max-width:350px){
.header-inner{padding:8px}
main{padding:12px 8px}
.app{padding:11px;border-radius:8px}
.app-top{gap:9px}
.icon{width:46px;height:46px;min-width:46px}
.app-name{font-size:15px}
.description{font-size:12px}
.description-text{height:54px}
.download{font-size:13px;padding:8px}
}
</style>
</head>
<body>
<header>
<div class="header-inner">
<div class="search">
<input id="search" type="search" placeholder="搜索破解版软件..." autocomplete="off">
</div>
</div>
</header>
<main>
<div class="apps" id="apps"></div>
<div class="empty" id="empty">没有找到相关软件</div>
</main>
<script>
let applications=[];
const appsContainer=document.getElementById("apps");
const searchInput=document.getElementById("search");
const empty=document.getElementById("empty");

function getSearchFromURL(){
const params=new URLSearchParams(window.location.search);
return params.get("search")||"";
}

function updateURL(keyword){
const url=new URL(window.location.href);
if(keyword.trim())url.searchParams.set("search",keyword.trim());
else url.searchParams.delete("search");
window.history.replaceState({},"",url);
}

async function loadApps(){
try{
const response=await fetch("apps.json?"+Date.now());
if(!response.ok)throw new Error("apps.json 加载失败");
applications=await response.json();
searchInput.value=getSearchFromURL();
render();
}catch(error){
appsContainer.innerHTML='<div style="padding:30px;color:red">无法加载 apps.json</div>';
console.error(error);
}
}

searchInput.addEventListener("input",function(){
updateURL(this.value);
render();
});

window.addEventListener("popstate",function(){
searchInput.value=getSearchFromURL();
render();
});

function render(){
const keyword=searchInput.value.trim().toLowerCase();
const filtered=applications.filter(app=>{
if(!keyword)return true;
const text=[app.name,app.description,app.version,app.category,app.author].filter(Boolean).join(" ").toLowerCase();
return text.includes(keyword);
});

appsContainer.innerHTML="";
empty.style.display=filtered.length?"none":"block";

filtered.forEach(app=>{
const element=document.createElement("div");
element.className="app";
element.innerHTML=`
<div class="app-top">
<img class="icon" src="${escapeHTML(app.icon||"")}" onerror="this.style.visibility='hidden'">
<div>
<div class="app-name">${escapeHTML(app.name||"")}</div>
<div class="description">
<div class="description-text">${escapeHTML(app.description||"")}</div>
<span class="description-toggle">展开</span>
</div>
</div>
</div>
<div class="meta">
${app.version?`<span class="tag">v${escapeHTML(app.version)}</span>`:""}
${app.category?`<span class="tag">${escapeHTML(app.category)}</span>`:""}
${app.size?`<span class="tag">${escapeHTML(app.size)}</span>`:""}
</div>
<a class="download" href="${escapeHTML(app.download||"#")}" target="_blank" rel="noopener noreferrer">下载破解版软件</a>
`;
appsContainer.appendChild(element);

const description=element.querySelector(".description");
const text=element.querySelector(".description-text");
const toggle=element.querySelector(".description-toggle");

requestAnimationFrame(()=>{
if(text.scrollHeight>text.clientHeight+1){
description.classList.add("has-overflow");
}
});

toggle.addEventListener("click",()=>{
const expanded=description.classList.toggle("expanded");
toggle.textContent=expanded?"收起":"展开";
});
});
}

function escapeHTML(value){
return String(value).replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;");
}

loadApps();
</script>
</body>
</html>
